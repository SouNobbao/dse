name: Build DSE

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      drvloader_updated: ${{ steps.fetch_drvloader.outputs.drvloader_changed }}
      kvc_updated: ${{ steps.fetch_kvc.outputs.kvc_changed }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Compiler || Cache APT
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: clang lld mingw-w64 upx-ucl 7zip

    - name: Cache kvc binary
      id: cache_kvc
      uses: actions/cache@v4
      with:
        path: kvc_bin.cpp
        key: kvc-bin-${{ hashFiles('kvc_bin.cpp') }}
        restore-keys: |
          kvc-bin-

    - name: Fetch latest kvc from upstream
      id: fetch_kvc
      continue-on-error: true
      run: |
        set -euo pipefail

        echo "Fetching latest kvc release..."

        curl -fsSL -o kvc_release.7z \
          "https://github.com/wesmar/kvc/releases/download/latest/kvc.7z"
        mkdir -p kvc_extracted
        7z x kvc_release.7z -okvc_extracted/ -pgithub.com

        KVC_BIN=$(find kvc_extracted -type f \( -name "kvc.exe" -o -name "kvc" \) | head -n1)
        if [[ -z "$KVC_BIN" ]]; then
          echo "::warning::kvc binary not found inside upstream archive. Contents:"
          find kvc_extracted -type f
          echo "Falling back to repo copy."
          exit 1
        fi

        # Compare hash with cached version to skip redundant updates
        NEW_CPP=$(mktemp)
        xxd -i -n bin_patcher "$KVC_BIN" > "$NEW_CPP"
        echo 'constexpr auto patcherEnablearg = L"dse on";' >> "$NEW_CPP"
        echo 'constexpr auto patcherDisablearg = L"dse off";' >> "$NEW_CPP"

        if [[ -f kvc_bin.cpp ]]; then
          OLD_HASH=$(sha256sum kvc_bin.cpp | cut -d' ' -f1)
          NEW_HASH=$(sha256sum "$NEW_CPP" | cut -d' ' -f1)
          if [[ "$OLD_HASH" == "$NEW_HASH" ]]; then
            echo "kvc_bin.cpp unchanged (hash match), skipping update."
            echo "kvc_changed=false" >> $GITHUB_OUTPUT
            rm -f "$NEW_CPP"
            exit 0
          fi
        fi

        mv "$NEW_CPP" kvc_bin.cpp
        echo "kvc_bin.cpp updated from upstream ($(wc -l < kvc_bin.cpp) lines)"
        echo "kvc_changed=true" >> $GITHUB_OUTPUT

    - name: kvc source report
      run: |
        if [[ "${{ steps.fetch_kvc.outcome }}" == "success" ]]; then
          echo "Using upstream kvc binary for build."
        elif [[ -f kvc_bin.cpp ]]; then
          echo "Upstream fetch failed, using existing kvc_bin.cpp from repo."
        else
          echo "::error::No kvc_bin.cpp available and upstream fetch failed. Aborting."
          exit 1
        fi

    - name: Cache drvloader binary
      id: cache_drvloader
      uses: actions/cache@v4
      with:
        path: drvloader_bin.cpp
        key: drvloader-bin-${{ hashFiles('drvloader_bin.cpp') }}
        restore-keys: |
          drvloader-bin-

    - name: Fetch latest drvloader from upstream
      id: fetch_drvloader
      continue-on-error: true
      run: |
        set -euo pipefail

        echo "Fetching latest drvloader release..."

        curl -fsSL -o drvloader.exe \
          "https://github.com/SouNobbao/drvloader-fork/releases/latest/download/drvloader.exe"

        # Compare hash with cached version to skip redundant updates
        NEW_CPP=$(mktemp)
        xxd -i -n bin_patcher drvloader.exe > "$NEW_CPP"
        echo 'constexpr auto patcherEnablearg = L"restore";' >> "$NEW_CPP"
        echo 'constexpr auto patcherDisablearg = L"bypass";' >> "$NEW_CPP"

        if [[ -f drvloader_bin.cpp ]]; then
          OLD_HASH=$(sha256sum drvloader_bin.cpp | cut -d' ' -f1)
          NEW_HASH=$(sha256sum "$NEW_CPP" | cut -d' ' -f1)
          if [[ "$OLD_HASH" == "$NEW_HASH" ]]; then
            echo "drvloader_bin.cpp unchanged (hash match), skipping update."
            echo "drvloader_changed=false" >> $GITHUB_OUTPUT
            rm -f "$NEW_CPP"
            exit 0
          fi
        fi

        mv "$NEW_CPP" drvloader_bin.cpp
        echo "drvloader_bin.cpp updated from upstream ($(wc -l < drvloader_bin.cpp) lines)"
        echo "drvloader_changed=true" >> $GITHUB_OUTPUT

    - name: drvloader source report
      run: |
        if [[ "${{ steps.fetch_drvloader.outcome }}" == "success" ]]; then
          echo "Using upstream drvloader binary for build."
        elif [[ -f drvloader_bin.cpp ]]; then
          echo "Upstream fetch failed, using existing drvloader_bin.cpp from repo."
        else
          echo "::error::No drvloader_bin.cpp available and upstream fetch failed. Aborting."
          exit 1
        fi

    - name: Build DLLs
      run: |
        set -euo pipefail
        mkdir -p build

        COMMON_FLAGS=(
          --target=x86_64-w64-mingw32
          -Oz
          -mwindows
          -municode
          -shared
          -static
          -x
          c++
          -Wno-deprecated
          -fuse-ld=lld
          -Iminhook/include
          -ffunction-sections
          -fdata-sections
          -flto=thin
          -Wl,--gc-sections
          -Wl,--icf=all
          -fvisibility=hidden
          -fno-unwind-tables
          -fno-asynchronous-unwind-tables
          -fno-exceptions
          -fno-rtti
          -Wl,--strip-all
          -Wl,--build-id=none
        )

        SOURCES=(
          config.cpp
          checks.cpp
          dllmain.cpp
          events.cpp
          injector.cpp
          patcher.cpp
          log.cpp
          watchdog.cpp
          afterburner.cpp
          hide_module.cpp
          minhook/src/buffer.c
          minhook/src/hook.c
          minhook/src/trampoline.c
          minhook/src/hde/hde64.c
          minhook/src/hde/hde32.c
        )

        LIBS=(
          -lshlwapi
        )

        PEFILE_FLAGS=(
          --target=x86_64-w64-mingw32
          -Oz
          -mconsole
          -static
          -x
          c++
          -fuse-ld=lld
          -Iminhook/include
          -ffunction-sections
          -fdata-sections
          -flto=thin
          -Wl,--gc-sections
          -Wl,--icf=all
          -fvisibility=hidden
          -fno-unwind-tables
          -fno-asynchronous-unwind-tables
          -fno-exceptions
          -fno-rtti
          -Wl,--strip-all
          -Wl,--build-id=none
        )

        clang++ "${COMMON_FLAGS[@]}" -D_STABLE "${SOURCES[@]}" "${LIBS[@]}" \
          -o build/dse.dll &

        clang++ "${COMMON_FLAGS[@]}" "${SOURCES[@]}" "${LIBS[@]}" \
          -o build/dse_kvc.dll &

        clang++ "${PEFILE_FLAGS[@]}" -o build/pefile.exe pefile/pefile.cpp pefile/main.cpp

        wait
        
    - name: Compress DLLs with UPX
      run: |
        set -euo pipefail
        upx --best --lzma build/*

    - name: Copy extras to build
      run: cp -v extras/* build/

    - name: Create archive for release
      run: |
        7z a -t7z build/build.7z build/* -x!build/build.7z

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dse-x64
        path: build/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Download x64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: dse-x64
        path: ./release

    - name: Generate SHA-256 checksums
      id: checksums
      run: |
        set -euo pipefail
        cd release
        {
          echo "sha256<<EOF"
          find . -maxdepth 1 -type f ! -name 'sha256hashes.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's|^\([a-f0-9]\+\)  \./|\1  |' | tee sha256hashes.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Generate release info
      id: release_info
      env:
        KVC_UPDATED: ${{ needs.build.outputs.kvc_updated }}
        DRVLOADER_UPDATED: ${{ needs.build.outputs.drvloader_updated }}
      run: |
        echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
        echo "month_year=$(date +'%m.%Y')" >> "$GITHUB_OUTPUT"

        if [ "$KVC_UPDATED" = "true" ]; then
          {
            echo "kvc_note<<EOF"
            echo "- kvc was updated to latest ([kvc repo](https://github.com/wesmar/kvc/))"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "kvc_note=" >> "$GITHUB_OUTPUT"
        fi

        if [ "$DRVLOADER_UPDATED" = "true" ]; then
          {
            echo "drvloader_note<<EOF"
            echo "- drvloader was updated to latest ([drvloader repo](https://github.com/SouNobbao/drvloader-fork/))"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "drvloader_note=" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.tag }}
        body: |
          **Build Date:** ${{ steps.release_info.outputs.date }}

          **Changes:**
          ${{ github.event.head_commit.message }}
          ${{ steps.release_info.outputs.kvc_note }}
          ${{ steps.release_info.outputs.drvloader_note }}

          > [!NOTE]
          > Please note that all dlls (and pefile) are compressed with UPX, so if you want to analyze them, please just use source code!!

          > [!NOTE]
          > Note for Windows 11 Insider users: this build doesnt provide pdbs from time to time (in case drvloader doesn't work),
          > so use KVC build as drvloader does not run correctly without those pdbs
          > also note we can't rely on kvc --safe mode as the command (`kvc dse`) does not show its state, so bsods may happen

          ```
          Includes:
          - dse.dll : toggle dse modes via drvloader (check dse.ini for config) (contains export to add to launchers)
          - dse_kvc.dll : toggle dse modes via kvc

          Launchers (these launchers already have dse.dll linked, so you can replace the original launcher with these or link it manually):
          - hypervisor-launcher.exe
          - steamclient_loader_x64.exe

          PEFile :
          - pefile.exe : i cant really find a good description to put here, so thingy to link dlls, usage: `pefile.exe [target] [dll to load] [function to call separated by commas]`
          ```

          **SHA-256 Hashes:**
          ```
          ${{ steps.checksums.outputs.sha256 }}
          ```
          
        draft: false
        prerelease: false
        files: |
          ./release/dse.dll
          ./release/dse_kvc.dll
          ./release/hypervisor-launcher.exe
          ./release/steamclient_loader_x64.exe
          ./release/build.7z
          ./release/pefile.exe
          ./release/pe_reader.exe
          ./release/sha256hashes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
