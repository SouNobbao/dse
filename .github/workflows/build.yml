name: Build DSE

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: {}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup utilities || Cache APT
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: upx-ucl 7zip

    - name: Cache llvm-mingw
      uses: actions/cache@v6
      id: cache-llvm-mingw
      with:
        path: llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64
        key: llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64

    - name: Setup llvm-mingw
      if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
      run: |
        curl -L -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz"
        tar -xf llvm-mingw.tar.xz
        rm llvm-mingw.tar.xz

    - name: Add llvm-mingw to PATH
      run: echo "$PWD/llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64/bin" >> $GITHUB_PATH

    - name: Build DLLs with CMake
      run: |
        set -euo pipefail
        mkdir -p build
        mkdir -p bins

        # build elevator executable with clang (small standalone target)
        clang++ --target=x86_64-w64-mingw32 -Oz -mwindows -municode -static -x c++ -fuse-ld=lld -ffunction-sections -fdata-sections -flto=thin -Wl,--gc-sections -Wl,--strip-all elevator.cpp -lshell32 -lshlwapi -o bins/dse_elevator.exe

        # Configure and build with CMake (produces dse.dll)
        cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-clang -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-clang++
        cmake --build build -- -j $(nproc)

        # Build pefile with clang++ (keeps parity with previous workflow)
        clang++ --target=x86_64-w64-mingw32 -Oz -mconsole -static -x c++ -fuse-ld=lld -Iminhook/include -ffunction-sections -fdata-sections -flto=thin -Wl,--gc-sections -Wl,--icf=all -fvisibility=hidden -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-exceptions -fno-rtti -Wl,--strip-all -Wl,--build-id=none -o build/pefile.exe pefile/pefile.cpp pefile/main.cpp

    - name: Copy extras to build
      run: cp -v extras/* build/

    - name: Create archive for release
      run: |
        7z a -t7z build/build.7z build/* -x!build/build.7z

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dse-x64
        path: |
          build/
          bins/
        retention-days: 30

  release:
    needs: [build, build_msvc]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Download Linux/MinGW artifacts
      uses: actions/download-artifact@v8
      with:
        name: dse-x64
        path: ./release

    - name: Download MSVC artifacts
      uses: actions/download-artifact@v8
      with:
        name: dse-x64-msvc
        path: ./release

    - name: Normalize release artifacts
      if: always()
      run: |
        set -euo pipefail
        cd release
        if [ -f build/dse.dll ]; then mv -f build/dse.dll . || true; fi

        # Move other helper tools into release root (avoid overwriting dse dlls)
        shopt -s globstar || true
        for f in **/hypervisor-launcher.exe **/steamclient_loader_x64.exe **/build.7z **/pefile.exe **/pe_reader.exe **/sha256hashes.txt; do
          if [ -f "$f" ]; then
            mv -f "$f" . || true
          fi
        done

        # Ensure MSVC zip is at release/dse_msvc.zip (take first found)
        for z in **/dse_msvc.zip; do
          if [ -f "$z" ]; then
            mv -f "$z" dse_msvc.zip || true
            break
          fi
        done

        # Remove any stray MSVC dse.dll copies (keep the linux-provided root copy)
        find . -type f -name 'dse.dll' -not -path './dse.dll' -delete || true

        # Clean up nested empty release folders if any
        find . -type d -empty -not -path '.' -delete || true

    - name: Generate SHA-256 checksums
      id: checksums
      run: |
        set -euo pipefail
        cd release
        {
          echo "sha256<<EOF"
          find . -maxdepth 1 -type f ! -name 'sha256hashes.txt' ! -name 'dse_elevator.exe' -print0 | sort -z | xargs -0 sha256sum | sed 's|^\([a-f0-9]\+\)  \./|\1  |' | tee sha256hashes.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Generate release info
      id: release_info
      run: |
        echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
        echo "month_year=$(date +'%m.%Y')" >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.tag }}
        body: |
          **Build Date:** ${{ steps.release_info.outputs.date }}

          **Changes:**
          ${{ github.event.head_commit.message }}

          > [!NOTE]
          > If PDBs are unavailable (e.g. Windows Insider builds), dse.dll will automatically
          > offer to fall back to the standard g_CiOptions method via a MessageBox prompt.

          ```
          Includes:
          - dse.dll : toggle dse modes (check dse.ini for config) (contains export to add to launchers)

          Launchers (these launchers already have dse.dll linked, so you can replace the original launcher with these or link it manually):
          - hypervisor-launcher.exe
          - steamclient_loader_x64.exe

          PEFile :
          - pefile.exe : i cant really find a good description to put here, so thingy to link dlls, usage: `pefile.exe [target] [dll to load] [function to call separated by commas]`
          ```

          **SHA-256 Hashes:**
          ```
          ${{ steps.checksums.outputs.sha256 }}
          ```
          
        draft: false
        prerelease: false
        files: |
          ./release/dse.dll
          ./release/hypervisor-launcher.exe
          ./release/steamclient_loader_x64.exe
          ./release/build.7z
          ./release/pefile.exe
          ./release/pe_reader.exe
          ./release/sha256hashes.txt
          ./release/dse_msvc.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_msvc:
    name: Build (MSVC)
    runs-on: windows-2022
    needs: build
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download Linux/MinGW artifacts for MSVC job
      uses: actions/download-artifact@v8
      with:
        name: dse-x64
        path: linux_artifacts

    - name: Setup MSVC environment
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Build with MSVC
      shell: powershell
      run: |
        # Prepare bins dir
        md bins -Force | Out-Null

        # If linux/minGW artifacts provided an elevator, copy it into bins
        if (Test-Path '.\linux_artifacts\bins\dse_elevator.exe') { copy .\linux_artifacts\bins\dse_elevator.exe .\bins\dse_elevator.exe }

        # Build elevator.exe via cl only if not provided by linux artifacts
        if (-not (Test-Path '.\bins\dse_elevator.exe')) {
          cl /nologo /std:c++17 /O2 /W3 /MD /EHsc elevator.cpp /link /OUT:bins\dse_elevator.exe shlwapi.lib
        }

        # Replace placeholders
        $xxd = Get-Command xxd -ErrorAction SilentlyContinue
        function Get-Hex([string]$path){ if ($xxd) { $i = & xxd -i $path | Out-String; $m = [regex]::Match($i,'\{([\s\S]*)\}\s*;'); if ($m.Success){ return $m.Groups[1].Value } else { throw 'xxd parse failed' } } else { $b = [System.IO.File]::ReadAllBytes($path); return ($b | ForEach-Object { '0x' + $_.ToString('x2') }) -join ', ' } }
        if (Test-Path '.\bins\dse_elevator.exe') { $el = Get-Hex '.\bins\dse_elevator.exe'; (Get-Content '.\elevator_bin.cpp' -Raw) -replace '%placeholder_el_bin%',$el | Set-Content '.\elevator_bin.cpp' -Encoding ASCII }

        # Configure and build with NMake
        cmake -S . -B build-msvc -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build build-msvc --config Release

        # Copy outputs
        md release -Force | Out-Null
        copy build-msvc\dse.dll release\dse.dll
        copy bins\dse_elevator.exe release\dse_elevator.exe

        # Generate a self-signed PFX and sign DLLs before packaging
        Write-Host "Generating self-signed PFX on runner"
        $genOut = & powershell -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\generate_pfx.ps1 -EmitEnvToStdout
        # parse output lines like SIGNING_PFX=... and SIGNING_PASSWORD=...
        if ($genOut) {
          $genOut -split "`n" | ForEach-Object {
            $line = $_.Trim()
            if ($line -match '^SIGNING_PFX=') { $val = $line -replace '^SIGNING_PFX=', ''; Set-Item -Path env:\SIGNING_PFX -Value $val }
            if ($line -match '^SIGNING_PASSWORD=') { $val = $line -replace '^SIGNING_PASSWORD=', ''; Set-Item -Path env:\SIGNING_PASSWORD -Value $val }
            if ($line -match '^PFX_PATH=') { $val = $line -replace '^PFX_PATH=', ''; Set-Item -Path env:\PFX_PATH -Value $val }
          }
        }

        if ($env:SIGNING_PFX -and $env:SIGNING_PASSWORD) {
          Write-Host "Signing artifacts with generated PFX"
          $pfxOut = Join-Path $PWD 'release\codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfxOut, [System.Convert]::FromBase64String($env:SIGNING_PFX))
          $sigtool = "signtool"
          # Sign DLLs
          if (Test-Path 'release\dse.dll') { & $sigtool sign /f $pfxOut /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 release\dse.dll }
          Remove-Item $pfxOut -Force
        } else {
          Write-Host "Failed to generate signing secrets; skipping code signing"
        }

        # Create a zip that contains an _msvc folder with the MSVC outputs and the linux-built bins
        $tmp = Join-Path $PWD 'msvc_pkg_tmp'
        if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
        New-Item -ItemType Directory -Path (Join-Path $tmp '_msvc') | Out-Null
        copy release\dse.dll (Join-Path $tmp '_msvc\dse.dll')
        $zipPath = Join-Path $PWD 'release\dse_msvc.zip'
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Compress-Archive -Path (Join-Path $tmp '*') -DestinationPath $zipPath
        Remove-Item -Recurse -Force $tmp

    - name: Upload MSVC artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dse-x64-msvc
        path: release/
        retention-days: 30
