name: Build DSE

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      drvloader_updated: ${{ steps.fetch_drvloader.outputs.drvloader_changed == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Compiler || Cache APT
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: clang lld mingw-w64 upx-ucl 7zip
    
    - name: Cache drvloader binary
      id: cache_drvloader
      uses: actions/cache@v4
      with:
        path: drvloader_bin.cpp
        key: drvloader-bin-${{ hashFiles('drvloader_bin.cpp') }}
        restore-keys: |
          drvloader-bin-

    - name: Fetch latest drvloader from upstream
      id: fetch_drvloader
      continue-on-error: true
      run: |
        set -euo pipefail

        echo "Fetching latest KernelResearchKit release..."

        curl -fsSL -o KernelResearchKit.7z \
          "https://github.com/wesmar/KernelResearchKit/releases/download/bypass-code-integrity/KernelResearchKit.7z"
        mkdir -p krk_extracted
        7z x KernelResearchKit.7z -okrk_extracted/ -pgithub.com

        DRVLOADER_BIN=$(find krk_extracted -type f \( -name "drvloader.exe" \) | head -n1)
        if [[ -z "$DRVLOADER_BIN" ]]; then
          echo "::warning::drvloader binary not found inside upstream archive. Contents:"
          find krk_extracted -type f
          echo "Falling back to repo copy."
          exit 1
        fi

        # Compare hash with cached version to skip redundant updates
        NEW_CPP=$(mktemp)
        xxd -i -n drvloader_exe "$DRVLOADER_BIN" > "$NEW_CPP"

        if [[ -f drvloader_bin.cpp ]]; then
          OLD_HASH=$(sha256sum drvloader_bin.cpp | cut -d' ' -f1)
          NEW_HASH=$(sha256sum "$NEW_CPP" | cut -d' ' -f1)
          if [[ "$OLD_HASH" == "$NEW_HASH" ]]; then
            echo "drvloader_bin.cpp unchanged (hash match), skipping update."
            echo "drvloader_changed=false" >> $GITHUB_OUTPUT
            rm -f "$NEW_CPP"
            exit 0
          fi
        fi

        mv "$NEW_CPP" drvloader_bin.cpp
        echo "drvloader_bin.cpp updated from upstream ($(wc -l < drvloader_bin.cpp) lines)"
        echo "drvloader_changed=true" >> $GITHUB_OUTPUT

    - name: drvloader source report
      run: |
        if [[ "${{ steps.fetch_drvloader.outcome }}" == "success" ]]; then
          echo "Using upstream drvloader binary for build."
        elif [[ -f drvloader_bin.cpp ]]; then
          echo "Upstream fetch failed, using existing drvloader_bin.cpp from repo."
        else
          echo "::error::No drvloader_bin.cpp available and upstream fetch failed. Aborting."
          exit 1
        fi

    - name: Build DLLs
      run: |
        set -euo pipefail
        mkdir -p build

        COMMON_FLAGS=(
          --target=x86_64-w64-mingw32
          -Oz
          -mwindows
          -municode
          -shared
          -static
          -x
          c++
          -fuse-ld=lld
          -Iminhook/include
          -ffunction-sections
          -fdata-sections
          -flto=thin
          -Wl,--gc-sections
          -Wl,--icf=all
          -fvisibility=hidden
          -fno-unwind-tables
          -fno-asynchronous-unwind-tables
          -fno-exceptions
          -fno-rtti
          -Wl,--strip-all
          -Wl,--build-id=none
        )

        SOURCES=(
          config.cpp
          dllmain.cpp
          events.cpp
          injector.cpp
          drvloader.cpp
          log.cpp
          watchdog.cpp
          minhook/src/buffer.c
          minhook/src/hook.c
          minhook/src/trampoline.c
          minhook/src/hde/hde64.c
          minhook/src/hde/hde32.c
        )

        LIBS=(
          -lshlwapi
          -luser32
          -lkernel32
          -ladvapi32
        )

        clang++ "${COMMON_FLAGS[@]}" "${SOURCES[@]}" "${LIBS[@]}" \
          -o build/dse.dll &

        wait

    - name: Compress DLLs with UPX
      run: |
        set -euo pipefail
        upx --best --lzma build/*.dll

    - name: Copy extras to build
      run: cp -v extras/* build/

    - name: Create archive for release
      run: |
        7z a -t7z build/build.7z build/* -x!build/build.7z

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dse-x64
        path: build/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Download x64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: dse-x64
        path: ./release

    - name: Generate SHA-256 checksums
      id: checksums
      run: |
        set -euo pipefail
        cd release
        {
          echo "sha256<<EOF"
          find . -maxdepth 1 -type f ! -name 'sha256hashes.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's|^\([a-f0-9]\+\)  \./|\1  |' | tee sha256hashes.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Generate release info
      id: release_info
      run: |
        echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        MONTH_YEAR="$(date +'%m.%Y')"
        echo "month_year=$MONTH_YEAR" >> "$GITHUB_OUTPUT"

        if [[ "${{ needs.build.outputs.drvloader_updated }}" == "true" ]]; then
          echo "drvloader_note=> drvloader was updated to latest ([KernelResearchKit repo](https://github.com/wesmar/KernelResearchKit/) - `KernelResearchKit Framework - Release $MONTH_YEAR`)" >> "$GITHUB_OUTPUT"
        else
          echo "drvloader_note=" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.tag }}
        body: |
          **Build Date:** ${{ steps.release_info.outputs.date }}

          **Changes:**
          ${{ github.event.head_commit.message }}
          ${{ steps.release_info.outputs.drvloader_note }}

          > [!NOTE]
          > Please note that all dlls are compressed with UPX, so if you want to analyze them, please just use source code!!
          
          ```
          Includes:
          - dse.dll : toggle dse modes via drvloader (check dse.ini for config) (contains export to add to launchers)

          Launchers (these launchers already have dse.dll linked, so you can replace the original launcher with these or link it manually):
          - hypervisor-launcher.exe
          - steamclient_loader_x64.exe
          ```

          **SHA-256 Hashes:**
          ```
          ${{ steps.checksums.outputs.sha256 }}
          ```
          
        draft: false
        prerelease: false
        files: |
          ./release/dse.dll
          ./release/hypervisor-launcher.exe
          ./release/steamclient_loader_x64.exe
          ./release/build.7z
          ./release/sha256hashes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
