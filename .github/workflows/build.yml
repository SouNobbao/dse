name: Build DSE

permissions:
  contents: write

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      drvloader_updated: ${{ steps.fetch_drvloader.outputs.drvloader_changed == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Compiler || Cache APT
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: clang lld mingw-w64 upx-ucl 7zip

    - name: Build DLLs
      run: |
        set -euo pipefail
        mkdir -p build

        COMMON_FLAGS=(
          --target=x86_64-w64-mingw32
          -Oz
          -mwindows
          -municode
          -shared
          -static
          -x
          c++
          -Wno-deprecated
          -fuse-ld=lld
          -Iminhook/include
          -ffunction-sections
          -fdata-sections
          -flto=thin
          -Wl,--gc-sections
          -Wl,--icf=all
          -fvisibility=hidden
          -fno-unwind-tables
          -fno-asynchronous-unwind-tables
          -fno-exceptions
          -fno-rtti
          -Wl,--strip-all
          -Wl,--build-id=none
        )

        SOURCES=(
          config.cpp
          checks.cpp
          dllmain.cpp
          events.cpp
          injector.cpp
          patcher.cpp
          log.cpp
          watchdog.cpp
          afterburner.cpp
          minhook/src/buffer.c
          minhook/src/hook.c
          minhook/src/trampoline.c
          minhook/src/hde/hde64.c
          minhook/src/hde/hde32.c
        )

        LIBS=(
          -lshlwapi
          -luser32
          -lkernel32
          -ladvapi32
        )

        clang++ "${COMMON_FLAGS[@]}" -D_STABLE "${SOURCES[@]}" "${LIBS[@]}" \
          -o build/dse.dll &

        clang++ "${COMMON_FLAGS[@]}" "${SOURCES[@]}" "${LIBS[@]}" \
          -o build/dse_kvc.dll &

        wait

    - name: Build PEFile
      run: |
        set -euo pipefail
        mkdir -p build

        PEFILE_FLAGS=(
          --target=x86_64-w64-mingw32
          -Oz
          -mconsole
          -static
          -x
          c++
          -fuse-ld=lld
          -Iminhook/include
          -ffunction-sections
          -fdata-sections
          -flto=thin
          -Wl,--gc-sections
          -Wl,--icf=all
          -fvisibility=hidden
          -fno-unwind-tables
          -fno-asynchronous-unwind-tables
          -fno-exceptions
          -fno-rtti
          -Wl,--strip-all
          -Wl,--build-id=none
        )

        cd pefile

        clang++ "${PEFILE_FLAGS[@]}" -o ../build/pefile.exe pefile.cpp main.cpp

        cd ..

    - name: Compress DLLs with UPX
      run: |
        set -euo pipefail
        upx --best --lzma build/*

    - name: Copy extras to build
      run: cp -v extras/* build/

    - name: Create archive for release
      run: |
        7z a -t7z build/build.7z build/* -x!build/build.7z

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dse-x64
        path: build/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
    - name: Download x64 artifacts
      uses: actions/download-artifact@v8
      with:
        name: dse-x64
        path: ./release

    - name: Generate SHA-256 checksums
      id: checksums
      run: |
        set -euo pipefail
        cd release
        {
          echo "sha256<<EOF"
          find . -maxdepth 1 -type f ! -name 'sha256hashes.txt' -print0 | sort -z | xargs -0 sha256sum | sed 's|^\([a-f0-9]\+\)  \./|\1  |' | tee sha256hashes.txt
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Generate release info
      id: release_info
      run: |
        echo "tag=v$(date +'%Y.%m.%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: ${{ steps.release_info.outputs.tag }}
        body: |
          **Build Date:** ${{ steps.release_info.outputs.date }}

          **Changes:**
          ${{ github.event.head_commit.message }}
          ${{ steps.release_info.outputs.drvloader_note }}

          > [!NOTE]
          > Please note that all dlls (and pefile) are compressed with UPX, so if you want to analyze them, please just use source code!!
          
          > [!NOTE]
          > Windows 10 users should use KVC as drvloader does not run correctly in Windows 10
          > also note we can't rely on kvc --safe mode as it doesn't show its state

          ```
          Includes:
          - dse.dll : toggle dse modes via drvloader (check dse.ini for config) (contains export to add to launchers)
          - dse_kvc.dll : toggle dse modes via kvc

          Launchers (these launchers already have dse.dll linked, so you can replace the original launcher with these or link it manually):
          - hypervisor-launcher.exe
          - steamclient_loader_x64.exe

          PEFile :
          - pefile.exe : i cant really find a good description to put here, so thingy to link dlls, usage: `pefile.exe [target] [dll to load] [function to call separated by commas]`
          ```

          **SHA-256 Hashes:**
          ```
          ${{ steps.checksums.outputs.sha256 }}
          ```
          
        draft: false
        prerelease: false
        files: |
          ./release/dse.dll
          ./release/dse_kvc.dll
          ./release/hypervisor-launcher.exe
          ./release/steamclient_loader_x64.exe
          ./release/build.7z
          ./release/pefile.exe
          ./release/sha256hashes.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
